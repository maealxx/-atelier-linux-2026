<?xml version="1.0" encoding="UTF-8"?>
<!--
  Personnage 2D pour motion design (non animé).
  Chaque membre est un calque séparé, prêt à être riggé (After Effects, Rive, etc.).
  Pivots (point d'ancrage) indiqués dans data-pivot="x,y".
  Ordre des calques : de l'arrière vers l'avant.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000">
  <defs>
    <style>
      .peau   { fill: #F2C3A0; }
      .peau-o { fill: #E3A984; }
      .chev   { fill: #2B2140; }
      .haut   { fill: #FF6B5B; }
      .pant   { fill: #2F4B7C; }
      .chaus  { fill: #1E1E2A; }
    </style>
  </defs>

  <!-- OMBRE AU SOL -->
  <g id="ombre">
    <ellipse cx="300" cy="935" rx="130" ry="16" fill="#000" opacity="0.12"/>
  </g>

  <!-- ===== JAMBE GAUCHE (à l'écran) ===== -->
  <g id="jambe_G">
    <g id="cuisse_G" data-pivot="258,560">
      <line x1="258" y1="560" x2="252" y2="725" stroke="#2F4B7C" stroke-width="58" stroke-linecap="round"/>
    </g>
    <g id="tibia_G" data-pivot="252,725">
      <line x1="252" y1="725" x2="250" y2="885" stroke="#2F4B7C" stroke-width="50" stroke-linecap="round"/>
    </g>
    <g id="pied_G" data-pivot="250,890">
      <path class="chaus" d="M228,880 Q228,868 245,868 L262,868 Q274,868 274,885 L274,900 Q274,920 255,920 L205,920 Q188,920 190,905 Q192,890 210,886 Z"/>
      <rect x="188" y="912" width="88" height="10" rx="5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== JAMBE DROITE (à l'écran) ===== -->
  <g id="jambe_D">
    <g id="cuisse_D" data-pivot="342,560">
      <line x1="342" y1="560" x2="348" y2="725" stroke="#2F4B7C" stroke-width="58" stroke-linecap="round"/>
    </g>
    <g id="tibia_D" data-pivot="348,725">
      <line x1="348" y1="725" x2="350" y2="885" stroke="#2F4B7C" stroke-width="50" stroke-linecap="round"/>
    </g>
    <g id="pied_D" data-pivot="350,890">
      <path class="chaus" d="M372,880 Q372,868 355,868 L338,868 Q326,868 326,885 L326,900 Q326,920 345,920 L395,920 Q412,920 410,905 Q408,890 390,886 Z"/>
      <rect x="324" y="912" width="88" height="10" rx="5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== BASSIN ===== -->
  <g id="bassin" data-pivot="300,540">
    <path class="pant" d="M222,505 L378,505 L384,575 Q384,592 366,592 L234,592 Q216,592 216,575 Z"/>
    <rect x="220" y="505" width="160" height="14" rx="4" fill="#24395F"/>
  </g>

  <!-- ===== BRAS GAUCHE (à l'écran) — derrière le torse ===== -->
  <g id="bras_G">
    <g id="avant-bras_G" data-pivot="182,450">
      <line x1="182" y1="450" x2="170" y2="570" stroke="#F2C3A0" stroke-width="36" stroke-linecap="round"/>
    </g>
    <g id="main_G" data-pivot="170,575">
      <ellipse class="peau" cx="167" cy="598" rx="22" ry="26"/>
      <ellipse class="peau-o" cx="183" cy="592" rx="7" ry="11"/>
    </g>
    <g id="haut-bras_G" data-pivot="210,318">
      <line x1="210" y1="318" x2="182" y2="450" stroke="#F2C3A0" stroke-width="40" stroke-linecap="round"/>
      <path class="haut" d="M190,300 Q215,292 236,312 L222,395 Q200,402 178,390 L182,325 Q183,305 190,300 Z"/>
    </g>
  </g>

  <!-- ===== BRAS DROIT (à l'écran) ===== -->
  <g id="bras_D">
    <g id="avant-bras_D" data-pivot="418,450">
      <line x1="418" y1="450" x2="430" y2="570" stroke="#F2C3A0" stroke-width="36" stroke-linecap="round"/>
    </g>
    <g id="main_D" data-pivot="430,575">
      <ellipse class="peau" cx="433" cy="598" rx="22" ry="26"/>
      <ellipse class="peau-o" cx="417" cy="592" rx="7" ry="11"/>
    </g>
    <g id="haut-bras_D" data-pivot="390,318">
      <line x1="390" y1="318" x2="418" y2="450" stroke="#F2C3A0" stroke-width="40" stroke-linecap="round"/>
      <path class="haut" d="M410,300 Q385,292 364,312 L378,395 Q400,402 422,390 L418,325 Q417,305 410,300 Z"/>
    </g>
  </g>

  <!-- ===== COU ===== -->
  <g id="cou" data-pivot="300,300">
    <rect class="peau-o" x="282" y="240" width="36" height="68" rx="14"/>
  </g>

  <!-- ===== TORSE ===== -->
  <g id="torse" data-pivot="300,520">
    <path class="haut" d="M222,296 Q300,282 378,296 Q402,300 404,326 L384,515 L216,515 L196,326 Q198,300 222,296 Z"/>
    <!-- col en V -->
    <path class="peau" d="M276,290 L300,326 L324,290 Z"/>
    <path d="M272,289 L300,332 L328,289" fill="none" stroke="#E2554A" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- poche -->
    <rect x="330" y="360" width="34" height="30" rx="6" fill="#E2554A"/>
  </g>

  <!-- ===== TÊTE ===== -->
  <g id="tete" data-pivot="300,262">
    <g id="cheveux_arriere">
      <ellipse class="chev" cx="300" cy="170" rx="86" ry="80"/>
    </g>
    <g id="oreilles">
      <circle class="peau-o" cx="231" cy="198" r="15"/>
      <circle class="peau-o" cx="369" cy="198" r="15"/>
    </g>
    <g id="visage">
      <ellipse class="peau" cx="300" cy="192" rx="70" ry="76"/>
    </g>
    <g id="joues">
      <circle cx="258" cy="222" r="11" fill="#FF8A80" opacity="0.45"/>
      <circle cx="342" cy="222" r="11" fill="#FF8A80" opacity="0.45"/>
    </g>
    <g id="oeil_G" data-pivot="272,198">
      <ellipse cx="272" cy="198" rx="8" ry="10" fill="#1E1E2A"/>
      <circle cx="275" cy="194" r="3" fill="#FFFFFF"/>
    </g>
    <g id="oeil_D" data-pivot="328,198">
      <ellipse cx="328" cy="198" rx="8" ry="10" fill="#1E1E2A"/>
      <circle cx="331" cy="194" r="3" fill="#FFFFFF"/>
    </g>
    <g id="sourcil_G" data-pivot="272,172">
      <path d="M258,174 Q272,165 286,172" fill="none" stroke="#2B2140" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="sourcil_D" data-pivot="328,172">
      <path d="M314,172 Q328,165 342,174" fill="none" stroke="#2B2140" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="nez">
      <path d="M300,205 Q294,220 302,222" fill="none" stroke="#D99572" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="bouche" data-pivot="300,240">
      <path d="M284,236 Q300,252 316,236" fill="none" stroke="#7A2E3A" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="cheveux_avant">
      <path class="chev" d="M226,182 Q220,100 300,98 Q382,98 376,182 Q366,150 345,138 Q330,158 290,156 Q300,146 296,138 Q270,156 240,150 Q230,162 226,182 Z"/>
    </g>
  </g>
</svg>
