    header .logo img{height:64px;display:block;opacity:.9}
    main{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
    svg{width:100%;overflow:visible}
    a.nd{text-decoration:none;cursor:pointer}
    a.nd:hover rect{filter:brightness(.91)}
    .n{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600}
    .t{font-family:'Inter',sans-serif;font-size:17px;font-weight:700}
    .l{font-family:'JetBrains Mono',monospace;font-size:12px}
